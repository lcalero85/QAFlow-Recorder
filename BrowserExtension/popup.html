<!doctype html><html><head><meta charset="utf-8"><title>QAFlow Recorder</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><img class="logo" src="icons/icon48.png"><div class="brand"><b>QAFlow Recorder</b><span>Web QA evidence recorder</span></div><button id="exportTop" class="iconbtn" title="Download / export report">⬇</button></header>
<main class="wrap">
  <div class="state"><span id="stateDot" class="dot"></span><strong id="stateText">No session</strong><span style="margin-left:auto" id="timer" class="time">00:00</span></div>
  <div class="field"><label>Session name</label><input id="sessionName" placeholder="e.g. Checkout regression"></div>
  <div class="actions"><button id="startBtn" class="btn primary">▶ Start recording</button><button id="finishBtn" class="btn danger" disabled>■ Finish</button></div>
  <div class="actions"><button id="pauseBtn" class="btn" disabled>⏸ Pause</button><button id="captureBtn" class="btn" disabled>📷 Capture</button><button id="annotateBtn" class="btn" disabled>✎ Annotation</button><button id="bugBtn" class="btn danger" disabled>🐞 Bug</button></div>
  <div class="cards"><div class="metric"><span>Steps</span><b id="stepsMetric">0</b></div><div class="metric"><span>Pages</span><b id="pagesMetric">0</b></div><div class="metric"><span>Findings</span><b id="bugsMetric">0</b></div></div>
  <div class="section"><h3>Browser scope</h3><div id="scopeText" class="muted">Records the active web tab only. Input values are never stored.</div></div>
  <div class="actions"><button id="reviewBtn" class="btn">☰ Review flow</button><button id="historyBtn" class="btn">◷ History</button></div>
  <div id="recentBox" class="section hidden"><h3>Recent sessions</h3><div id="recentList" class="recent"></div></div>
</main>
<div id="annotationModal" class="modal"><div class="card"><h2>Flow annotation</h2><p class="muted">Add context or a reminder. Use Bug for formal defects.</p><div class="field"><label>Annotation</label><textarea id="annotationText"></textarea></div><label><input id="annotationShot" type="checkbox" checked> Attach screenshot</label><div class="actions"><button data-close="annotationModal" class="btn">Cancel</button><button id="saveAnnotation" class="btn primary">Save annotation</button></div></div></div>
<div id="bugModal" class="modal"><div class="card"><h2>Report bug</h2><div class="field"><label>Title / screen</label><input id="bugTitle"></div><div class="field"><label>Expected result</label><textarea id="bugExpected"></textarea></div><div class="field"><label>Actual result</label><textarea id="bugActual"></textarea></div><div class="row"><div class="field"><label>Severity</label><select id="bugSeverity"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div class="field"><label>Frequency</label><select id="bugFrequency"><option>First time</option><option>Sometimes</option><option>Always</option></select></div></div><div class="actions"><button data-close="bugModal" class="btn">Cancel</button><button id="saveBug" class="btn danger">Save bug + screenshot</button></div></div></div>
<script src="popup.js"></script></body></html>
