<!doctype html><html><head><meta charset="utf-8"><title>QAFlow · Review session</title><link rel="stylesheet" href="styles.css"><style>body{width:auto;min-width:900px}.wrap{max-width:1180px;margin:auto}.grid{width:100%;border-collapse:collapse}.grid th,.grid td{padding:9px;border-bottom:1px solid #26384b;text-align:left}.grid th{color:#9db2c7}.grid input[type=text]{width:100%;background:#101b29;color:#fff;border:1px solid #29415b;padding:7px;border-radius:6px}</style></head><body><header class="top"><img class="logo" src="icons/icon48.png"><div class="brand"><b>Review session</b><span>Keep useful steps, rename unclear actions and export.</span></div><button id="exportBtn" class="btn primary">⬇ Export</button></header><main class="wrap"><div id="summary" class="cards"></div><div class="section"><table class="grid"><thead><tr><th>Include</th><th>Time</th><th>Page</th><th>Action / element</th><th>Selector</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="saveBtn" class="btn primary">Save review</button></div></main><script src="review.js"></script></body></html>
